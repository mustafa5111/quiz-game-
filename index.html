<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة الأسئلة الجماعية</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; color: #fff; }
  .card { background: rgba(255,255,255,.12); backdrop-filter: blur(10px); border-radius: 20px; padding: 32px; width: 100%; max-width: 520px; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,.3); }
  h1 { font-size: 2rem; margin-bottom: 8px; }
  p.sub { opacity: .85; margin-bottom: 24px; }
  input, select { width: 100%; padding: 14px; border-radius: 12px; border: none; margin-bottom: 12px; font-size: 1rem; text-align: center; }
  button { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: transform .1s; }
  button:active { transform: scale(.97); }
  .btn-main { background: #ffd32a; color: #1a1a2e; }
  .btn-alt { background: rgba(255,255,255,.2); color: #fff; }
  .screen { display: none; }
  .screen.active { display: block; }
  .room-code { font-size: 3rem; letter-spacing: 12px; font-weight: bold; background: rgba(0,0,0,.3); border-radius: 12px; padding: 12px; margin: 16px 0; direction: ltr; }
  .player-list { list-style: none; margin: 16px 0; }
  .player-list li { background: rgba(255,255,255,.15); padding: 10px; border-radius: 10px; margin-bottom: 8px; }
  .timer-bar { height: 10px; background: rgba(255,255,255,.2); border-radius: 5px; overflow: hidden; margin-bottom: 20px; }
  .timer-fill { height: 100%; background: #ffd32a; width: 100%; transition: width 1s linear; }
  .question { font-size: 1.4rem; margin-bottom: 20px; min-height: 70px; }
  .opt { background: rgba(255,255,255,.15); padding: 14px; border-radius: 12px; margin-bottom: 10px; cursor: pointer; font-size: 1.05rem; border: 2px solid transparent; }
  .opt:hover { background: rgba(255,255,255,.25); }
  .opt.correct { background: #2ecc71; border-color: #fff; }
  .opt.wrong { background: #e74c3c; }
  .opt.disabled { pointer-events: none; opacity: .85; }
  .score-row { display: flex; justify-content: space-between; background: rgba(255,255,255,.12); padding: 10px 16px; border-radius: 10px; margin-bottom: 8px; }
  .score-row.first { background: rgba(255,211,42,.35); font-weight: bold; }
  .err { color: #ffb3b3; margin-top: 10px; min-height: 24px; }
  .hint { font-size: .85rem; opacity: .7; margin-top: 12px; }
</style>
</head>
<body>
<div class="card">

  <!-- الرئيسية -->
  <div id="s-home" class="screen active">
    <h1>🎮 لعبة الأسئلة</h1>
    <p class="sub">العب مع أصدقائك بلحظتها</p>
    <input id="name" placeholder="اسمك" maxlength="20">
    <button class="btn-main" onclick="createRoom()">إنشاء غرفة جديدة</button>
    <input id="code" placeholder="رمز الغرفة (4 حروف)" maxlength="4" style="text-transform:uppercase">
    <button class="btn-alt" onclick="joinRoom()">دخول غرفة</button>
    <div class="err" id="err"></div>
  </div>

  <!-- الانتظار -->
  <div id="s-lobby" class="screen">
    <h1>غرفة الانتظار</h1>
    <p class="sub">شارك الرمز مع أصدقائك</p>
    <div class="room-code" id="roomCode"></div>
    <ul class="player-list" id="players"></ul>
    <div id="hostControls" style="display:none">
      <select id="qcount">
        <option value="5">5 أسئلة</option>
        <option value="10" selected>10 أسئلة</option>
        <option value="15">15 سؤال</option>
      </select>
      <button class="btn-main" onclick="startGame()">▶ ابدأ اللعبة</button>
    </div>
    <p class="hint" id="waitHint">بانتظار المضيف لبدء اللعبة...</p>
  </div>

  <!-- السؤال -->
  <div id="s-question" class="screen">
    <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
    <p class="sub" id="qNum"></p>
    <div class="question" id="qText"></div>
    <div id="opts"></div>
  </div>

  <!-- النتائج -->
  <div id="s-scores" class="screen">
    <h1 id="scoresTitle">النتائج</h1>
    <div id="scoreList"></div>
    <p class="hint" id="nextHint"></p>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let isHost = false, myId = null, timerInt = null;

const show = id => document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 's-' + id));
const err = m => document.getElementById('err').textContent = m;

function createRoom() {
  const name = document.getElementById('name').value.trim();
  if (!name) return err('اكتب اسمك أولاً');
  socket.emit('create_room', { name });
}
function joinRoom() {
  const name = document.getElementById('name').value.trim();
  const code = document.getElementById('code').value.trim();
  if (!name) return err('اكتب اسمك أولاً');
  if (!code) return err('اكتب رمز الغرفة');
  socket.emit('join_room', { code, name });
}
function startGame() {
  socket.emit('start_game', { count: document.getElementById('qcount').value });
}

socket.on('room_joined', d => {
  isHost = d.isHost;
  document.getElementById('roomCode').textContent = d.code;
  renderPlayers(d.players);
  document.getElementById('hostControls').style.display = isHost ? 'block' : 'none';
  document.getElementById('waitHint').style.display = isHost ? 'none' : 'block';
  show('lobby');
});
socket.on('lobby_update', d => renderPlayers(d.players));
socket.on('error_msg', m => err(m));

function renderPlayers(players) {
  document.getElementById('players').innerHTML = players
    .map(p => `<li>${p.name} ${p.isHost ? '👑' : ''}</li>`).join('');
}

socket.on('game_started', () => show('question'));

socket.on('question', q => {
  show('question');
  document.getElementById('qNum').textContent = `السؤال ${q.index} من ${q.total}`;
  document.getElementById('qText').textContent = q.text;
  const box = document.getElementById('opts');
  box.innerHTML = '';
  q.options.forEach((o, i) => {
    const d = document.createElement('div');
    d.className = 'opt'; d.textContent = o;
    d.onclick = () => {
      socket.emit('submit_answer', { answer: i });
      box.querySelectorAll('.opt').forEach(x => x.classList.add('disabled'));
      d.style.borderColor = '#ffd32a';
    };
    box.appendChild(d);
  });
  // المؤقت
  clearInterval(timerInt);
  let t = q.time;
  const fill = document.getElementById('timerFill');
  fill.style.width = '100%';
  timerInt = setInterval(() => {
    t--;
    fill.style.width = (t / q.time * 100) + '%';
    if (t <= 0) clearInterval(timerInt);
  }, 1000);
});

socket.on('reveal', d => {
  clearInterval(timerInt);
  const opts = document.getElementById('opts').children;
  [...opts].forEach((o, i) => {
    o.classList.add('disabled');
    if (i === d.correct) o.classList.add('correct');
  });
  renderScores(d.scores, 'الإجابة الصحيحة ظهرت ✓', 'السؤال التالي قادم...');
});

socket.on('finished', d => {
  renderScores(d.scores, '🏆 النتائج النهائية', '');
  document.getElementById('nextHint').innerHTML = '<button class="btn-alt" onclick="location.reload()">لعبة جديدة</button>';
});

function renderScores(scores, title, hint) {
  show('scores');
  document.getElementById('scoresTitle').textContent = title;
  document.getElementById('nextHint').textContent = hint;
  document.getElementById('scoreList').innerHTML = scores
    .map((p, i) => `<div class="score-row ${i === 0 ? 'first' : ''}"><span>${i + 1}. ${p.name} ${p.streak >= 2 ? '🔥' + p.streak : ''}</span><span>${p.score}</span></div>`).join('');
}
</script>
</body>
</html>
